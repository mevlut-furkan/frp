<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elyrion Irk Rehberi — Karanlık Hasat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TEMA & RENK PALETİ — buradan değiştirin
     ============================================================ */
  :root {
    --bg-page:       #0d0a07;
    --bg-card:       #100d06;
    --bg-card-hover: #1a1409;
    --border-subtle: #2e2410;
    --border-gold:   #7a5c10;
    --border-glow:   #c9940a;
    --text-heading:  #f5e6b8;
    --text-body:     #c8b07a;
    --text-muted:    #6d5c35;
    --text-accent:   #d4a017;

    --race-aarakocra:   #5ba4cf;
    --race-aasimar:     #f0c040;
    --race-bearfolk:    #8b4513;
    --race-centaur:     #6b8e23;
    --race-changeling:  #9b7ec8;
    --race-dragonborn:  #c0392b;
    --race-dwarf:       #aaaaaa;
    --race-elf:         #3cb371;
    --race-fairy:       #ff69b4;
    --race-genasi-air:  #87ceeb;
    --race-genasi-earth:#a0785a;
    --race-genasi-water:#1e90ff;
    --race-genasi-fire: #ff4500;
    --race-githyanki:   #cd853f;
    --race-githzerai:   #9370db;
    --race-gnome:       #ffa500;
    --race-goliath:     #708090;
    --race-half-elf:    #20b2aa;
    --race-halfling:    #daa520;
    --race-half-orc:    #556b2f;
    --race-human:       #cd853f;
    --race-kalashtar:   #7b68ee;
    --race-leonin:      #d4a017;
    --race-orc:         #2e8b57;
    --race-satyr:       #8fbc8f;
    --race-tabaxi:      #e8975a;
    --race-tiefling:    #8b0000;
    --race-vulpin:      #e07840;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    color: var(--text-body);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 17px;
    line-height: 1.7;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 56px 20px 40px;
    border-bottom: 1px solid var(--border-gold);
    background: radial-gradient(ellipse at 50% 0%, rgba(201,148,10,0.08) 0%, transparent 65%);
  }
  .site-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .site-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(30px, 5vw, 54px);
    font-weight: 700;
    color: var(--text-heading);
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .site-title span { color: var(--text-accent); }
  .site-subtitle {
    font-size: 16px;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 28px;
  }
  .ornament { color: var(--text-accent); font-size: 20px; letter-spacing: 10px; }

  /* ===== KONTROLLER ===== */
  .controls {
    max-width: 960px;
    margin: 28px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1; min-width: 200px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 9px 14px;
    color: var(--text-body);
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--border-gold); }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    padding: 7px 16px;
    color: var(--text-muted);
    font-family: 'Crimson Text', serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--border-gold); color: var(--text-body); }
  .filter-btn.active { border-color: var(--border-glow); color: var(--text-accent); background: rgba(201,148,10,0.06); }

  .race-count {
    color: var(--text-muted);
    font-size: 14px;
    font-style: italic;
    padding: 10px 20px 4px;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ===== IZGARA ===== */
  .grid {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }

  /* ===== KART ===== */
  .race-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .race-card:hover {
    border-color: var(--card-accent, var(--border-gold));
    background: var(--bg-card-hover);
    transform: translateY(-3px);
  }

  /* Görsel */
  .card-image {
    position: relative;
    height: 340px;
    overflow: hidden;
    background: #080604;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-image img {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center center;
    transition: transform 0.4s ease, filter 0.4s ease;
    filter: brightness(0.9) saturate(0.95);
    display: block;
  }
  .race-card:hover .card-image img {
    transform: scale(1.03);
    filter: brightness(1) saturate(1.05);
  }
  .card-image::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent, var(--text-accent));
    opacity: 0.9;
  }
  /* Görsel üzerine degrade (altta kararmak için) */
  .card-image::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(to top, rgba(10,8,4,0.7) 0%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }
  .card-badge {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    padding: 3px 9px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--card-accent, var(--text-accent));
    text-transform: uppercase;
    z-index: 2;
  }
  .card-toggle-img {
    position: absolute;
    bottom: 12px; right: 12px;
    width: 28px; height: 28px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--text-heading);
    transition: transform 0.2s;
    z-index: 2;
  }
  .race-card.open .card-toggle-img { transform: rotate(180deg); }

  .card-header { padding: 16px 18px 10px; }
  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-heading);
    line-height: 1.2;
  }
  .card-type { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; font-style: italic; }
  .card-tagline {
    padding: 0 18px 14px;
    font-style: italic;
    color: var(--text-muted);
    font-size: 14.5px;
    border-bottom: 1px solid var(--border-subtle);
    line-height: 1.5;
  }

  /* ===== AÇILIR KISIM ===== */
  .card-body { display: none; padding: 16px 18px 18px; }
  .race-card.open .card-body { display: block; }

  .section { margin-bottom: 14px; }
  .section:last-child { margin-bottom: 0; }
  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    letter-spacing: 2px;
    color: var(--card-accent, var(--text-accent));
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
    opacity: 0.9;
  }
  .section-text { color: var(--text-body); font-size: 15px; line-height: 1.65; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 12px;
    margin-top: 4px;
  }
  .stat-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    padding: 6px 10px;
  }
  .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 1px; }
  .stat-value { font-size: 14px; color: var(--text-heading); font-weight: 600; }

  .ability-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .ability-item {
    border-left: 2px solid var(--card-accent, var(--border-gold));
    padding: 6px 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .ability-name { color: var(--text-heading); font-weight: 600; display: block; margin-bottom: 1px; font-size: 13px; }

  .subrace-box {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 10px 13px;
    margin-top: 7px;
  }
  .subrace-title { font-family: 'Cinzel', serif; font-size: 12px; color: var(--card-accent, var(--text-accent)); margin-bottom: 5px; }
  .subrace-text { font-size: 13.5px; color: var(--text-body); line-height: 1.55; }

  .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 16px; font-style: italic; grid-column: 1 / -1; }

  footer { border-top: 1px solid var(--border-subtle); text-align: center; padding: 22px 20px; color: var(--text-muted); font-size: 13px; font-style: italic; }

  .subnav {
    display: flex; justify-content: center; gap: 22px;
    padding: 12px 20px; border-bottom: 1px solid var(--border-subtle);
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; background: rgba(0,0,0,0.2);
  }
  .subnav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .subnav a:hover, .subnav a.current { color: var(--text-accent); }
  .subnav a.current { border-bottom: 1px solid var(--text-accent); padding-bottom: 3px; }
</style>
</head>

</footer>

let currentFilter = 'all';
function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function buildCard(race) {
  const accent = `var(--race-${race.id})`;
  const statsHtml = race.stats.map(s =>
    `<div class="stat-item"><span class="stat-label">${s.label}</span><span class="stat-value">${s.value}</span></div>`
  ).join('');
  const abilitiesHtml = race.abilities && race.abilities.length
    ? `<div class="section"><span class="section-label">Irk Özellikleri</span><div class="ability-list">${
        race.abilities.map(a => `<div class="ability-item"><span class="ability-name">${a.name}</span>${a.desc}</div>`).join('')
      }</div></div>` : '';
  const subraceHtml = race.subraces && race.subraces.length
    ? `<div class="section"><span class="section-label">Alt Irklar</span>${
        race.subraces.map(s => `<div class="subrace-box"><div class="subrace-title">${s.title}</div><div class="subrace-text">${s.desc}</div></div>`).join('')
      }</div>` : '';

  return `<article class="race-card" style="--card-accent:${accent}" data-type="${race.type}" data-name="${race.name.toLowerCase()}" onclick="toggleCard(this)">
    <div class="card-image">
      <img src="${race.img}" alt="${race.name}" loading="lazy" style="object-position:${race.imgPos||'center top'}">
      <span class="card-badge">${race.typeLabel.split('—')[0].trim()}</span>
      <div class="card-toggle-img">▾</div>
    </div>
    <div class="card-header">
      <div class="card-name">${race.name}</div>
      <div class="card-type">${race.typeLabel}</div>
    </div>
    <p class="card-tagline">${race.tagline}</p>
    <div class="card-body">
      <div class="section"><span class="section-label">Kısaca</span><p class="section-text">${race.lore}</p></div>
      <div class="section"><span class="section-label">Temel İstatistikler</span><div class="stat-grid">${statsHtml}</div></div>
      ${abilitiesHtml}${subraceHtml}
    </div>
  </article>`;
}

function toggleCard(card) { card.classList.toggle('open'); }

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.race-card');
  let visible = 0;
  cards.forEach(c => {
    const show = c.dataset.name.includes(q) && (currentFilter === 'all' || c.dataset.type === currentFilter);
    c.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const noRes = document.getElementById('noResults');
  if (visible === 0 && !noRes) {
    const el = document.createElement('p'); el.id='noResults'; el.className='no-results';
    el.textContent='Aramanızla eşleşen ırk bulunamadı.';
    document.getElementById('raceGrid').appendChild(el);
  } else if (visible > 0 && noRes) { noRes.remove(); }
  document.getElementById('raceCount').textContent = `${visible} ırk gösteriliyor`;
}

(function init() {
  document.getElementById('raceGrid').innerHTML = RACES.map(buildCard).join('');
  filterCards();
})();
</script>
